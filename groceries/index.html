<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantry</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#2a2622;--mute:#8a8178;--line:#e8e1d6;--accent:#3f7d4e;--warn:#c2410c}
@media(prefers-color-scheme:dark){:root{--bg:#171512;--card:#221f1b;--ink:#f1ece4;--mute:#9a9186;--line:#34302a;--accent:#6fbf83;--warn:#fb923c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 2px}
.sub{color:var(--mute);font-size:.85rem;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;background:var(--accent);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.big{width:100%;padding:16px;font-size:1.05rem}
.row{display:flex;gap:8px;margin:10px 0}
input[type=text]{flex:1;min-width:0;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0}
li input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent);flex:none}
li .name{flex:1;min-width:0;overflow-wrap:anywhere}
li .age{font-size:.75rem;color:var(--mute);white-space:nowrap}
li.old .age{color:var(--warn);font-weight:600}
li.done .name{text-decoration:line-through;color:var(--mute)}
li.done{opacity:.6}
li .x{background:none;border:0;color:var(--mute);font-size:1.2rem;cursor:pointer;padding:4px}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:22px 0 4px}
#status{font-size:.85rem;color:var(--mute);margin:8px 0;min-height:1.2em}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.panel[hidden]{display:none}
.foot{margin-top:28px;font-size:.8rem;color:var(--mute)}
.foot a,.foot button{color:var(--accent);background:none;border:0;font:inherit;cursor:pointer;padding:0;text-decoration:underline}
</style>
</head>
<body>
<main>
  <h1>🛒 Pantry</h1>
  <div class="sub" id="sync">Starting…</div>

  <input type="file" id="file" accept="image/*" hidden>
  <button class="btn big" id="scan">📷 Add a receipt photo</button>
  <div id="status"></div>

  <div class="panel" id="review" hidden>
    <strong>Check what was found</strong>
    <div class="sub">Remove anything that isn't food, fix names, then add.</div>
    <ul id="found"></ul>
    <div class="row"><button class="btn" id="addFound">Add to pantry</button><button class="btn ghost" id="cancelFound">Cancel</button></div>
  </div>

  <form class="row" id="manual">
    <input type="text" id="manualName" placeholder="Add an item by hand…" autocomplete="off">
    <button class="btn" type="submit">Add</button>
  </form>

  <h2>In the house</h2>
  <ul id="active"></ul>
  <div class="sub" id="empty" hidden>Nothing here yet. Add a receipt to get started.</div>

  <h2 id="doneHead">Used up / tossed</h2>
  <ul id="done"></ul>
  <div class="row"><button class="btn ghost" id="clearDone">Clear crossed-out items</button></div>

  <div class="foot">
    Tick the box when something is used up or has gone bad. Your partner's phone shows the same list.<br>
    <button id="share">Copy the shared link for the other person</button>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const API = 'https://jsonblob.com/api/jsonBlob';
const LS = 'pantry.v1';
let state = { items: [] };
let blobId = null;
let saveTimer = null;

const uid = () => Math.random().toString(36).slice(2, 10);
const setStatus = t => $('status').textContent = t || '';

// ---------- storage / sync ----------
function loadLocal() {
  try { state = JSON.parse(localStorage.getItem(LS + '.data')) || state; } catch {}
}
function saveLocal() {
  try { localStorage.setItem(LS + '.data', JSON.stringify(state)); } catch {}
}
function setSync(t) { $('sync').textContent = t; }

async function initSync() {
  const m = location.hash.match(/list=([\w-]+)/);
  try { blobId = (m && m[1]) || localStorage.getItem(LS + '.id'); } catch { blobId = m && m[1]; }
  try {
    if (blobId) {
      const r = await fetch(`${API}/${blobId}`, { headers: { Accept: 'application/json' } });
      if (!r.ok) throw new Error(r.status);
      const remote = await r.json();
      if (m) state = remote; else state = merge(state, remote);
    } else {
      const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(state) });
      if (!r.ok) throw new Error(r.status);
      blobId = (r.headers.get('Location') || '').split('/').pop();
    }
    try { localStorage.setItem(LS + '.id', blobId); } catch {}
    history.replaceState(null, '', '#list=' + blobId);
    setSync('Shared list · synced');
  } catch (e) {
    setSync('Offline — saved on this phone only');
  }
  render();
}

// merge by item id; newer "updated" wins
function merge(a, b) {
  const map = new Map();
  [...a.items, ...b.items].forEach(i => {
    const cur = map.get(i.id);
    if (!cur || (i.updated || 0) > (cur.updated || 0)) map.set(i.id, i);
  });
  return { items: [...map.values()] };
}

function persist() {
  saveLocal();
  render();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(push, 600);
}
async function push() {
  if (!blobId) return;
  try {
    // pull-merge-push so two people editing don't clobber each other
    const r = await fetch(`${API}/${blobId}`, { headers: { Accept: 'application/json' } });
    if (r.ok) state = merge(state, await r.json());
    await fetch(`${API}/${blobId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(state) });
    saveLocal(); render();
    setSync('Shared list · synced');
  } catch { setSync('Offline — will retry on next change'); }
}
async function refresh() {
  if (!blobId || document.hidden) return;
  try {
    const r = await fetch(`${API}/${blobId}`, { headers: { Accept: 'application/json' } });
    if (r.ok) { state = merge(state, await r.json()); saveLocal(); render(); setSync('Shared list · synced'); }
  } catch {}
}

// ---------- items ----------
function addItems(names) {
  const now = Date.now();
  names.forEach(n => { n = n.trim(); if (n) state.items.push({ id: uid(), name: n, added: now, done: false, updated: now }); });
  persist();
}
function toggle(id) {
  const i = state.items.find(x => x.id === id);
  if (i) { i.done = !i.done; i.updated = Date.now(); persist(); }
}
function remove(id) {
  // tombstone so removal syncs
  const i = state.items.find(x => x.id === id);
  if (i) { i.deleted = true; i.updated = Date.now(); persist(); }
}
function clearDone() {
  const now = Date.now();
  state.items.forEach(i => { if (i.done && !i.deleted) { i.deleted = true; i.updated = now; } });
  persist();
}

function ageDays(i) { return Math.floor((Date.now() - i.added) / 86400000); }
function ageText(i) {
  const d = ageDays(i);
  return d === 0 ? 'today' : d === 1 ? '1 day' : d + ' days';
}
function li(i) {
  const el = document.createElement('li');
  el.className = (i.done ? 'done ' : '') + (!i.done && ageDays(i) >= 7 ? 'old' : '');
  const cb = document.createElement('input');
  cb.type = 'checkbox'; cb.checked = i.done; cb.onchange = () => toggle(i.id);
  const n = document.createElement('span'); n.className = 'name'; n.textContent = i.name;
  const a = document.createElement('span'); a.className = 'age'; a.textContent = ageText(i);
  const x = document.createElement('button'); x.className = 'x'; x.textContent = '✕'; x.title = 'Delete'; x.onclick = () => remove(i.id);
  el.append(cb, n, a, x);
  return el;
}
function render() {
  const live = state.items.filter(i => !i.deleted);
  const act = live.filter(i => !i.done).sort((a, b) => a.added - b.added);
  const dn = live.filter(i => i.done).sort((a, b) => b.updated - a.updated);
  $('active').replaceChildren(...act.map(li));
  $('done').replaceChildren(...dn.map(li));
  $('empty').hidden = live.length > 0;
  $('doneHead').hidden = $('clearDone').parentElement.hidden = dn.length === 0;
}

// ---------- receipt OCR ----------
const SKIP = /\b(sub\s?total|total|tax|change|cash|credit|debit|visa|master|amex|balance|saving|savings|coupon|discount|card|auth|approved|thank|store|tel|phone|www|survey|receipt|cashier|manager|items? sold|tender|points|rewards?|member|due|payment|ref|trans|terminal|date|time|aid|lane)\b/i;
function parseReceipt(text) {
  const out = [];
  text.split('\n').forEach(raw => {
    let l = raw.trim();
    if (l.length < 3 || SKIP.test(l)) return;
    if (!/\d+[.,]\d{2}\s*[A-Za-z]?\s*$/.test(l)) return;   // must end in a price
    l = l.replace(/[-$]?\s*\d+[.,]\d{2}\s*[A-Za-z]?\s*$/, '')  // price
         .replace(/\b\d{4,}\b/g, '')                             // UPC / PLU codes
         .replace(/^\s*\d+\s*[xX@]\s*/, '')                      // leading qty
         .replace(/\b\d+\s*@.*$/, '')                            // "2 @ 1.99"
         .replace(/[^A-Za-z0-9 &'\/%.\-]/g, ' ')
         .replace(/\s+/g, ' ').trim();
    if (!/[A-Za-z]{3}/.test(l)) return;
    out.push(l.toLowerCase().replace(/\b\w/g, c => c.toUpperCase()));
  });
  return out;
}

function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
async function downscale(file) {
  const bmp = await createImageBitmap(file);
  const max = 2000, k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = bmp.width * k; c.height = bmp.height * k;
  const g = c.getContext('2d'); g.filter = 'grayscale(1) contrast(1.3)'; g.drawImage(bmp, 0, 0, c.width, c.height);
  return c;
}
async function scanReceipt(file) {
  try {
    setStatus('Loading reader…');
    if (!window.Tesseract) await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
    const img = await downscale(file);
    const { data } = await Tesseract.recognize(img, 'eng', {
      logger: m => { if (m.status === 'recognizing text') setStatus('Reading receipt… ' + Math.round(m.progress * 100) + '%'); }
    });
    const names = parseReceipt(data.text);
    setStatus(names.length ? '' : "Couldn't find any items. Try a flatter, brighter photo, or add by hand.");
    if (names.length) showReview(names);
  } catch (e) {
    setStatus('Could not read that photo. Check your connection and try again.');
  }
}
function showReview(names) {
  const ul = $('found'); ul.replaceChildren();
  names.forEach(n => {
    const el = document.createElement('li');
    const inp = document.createElement('input'); inp.type = 'text'; inp.value = n;
    const x = document.createElement('button'); x.className = 'x'; x.textContent = '✕'; x.onclick = () => el.remove();
    el.append(inp, x); ul.appendChild(el);
  });
  $('review').hidden = false;
  $('review').scrollIntoView({ behavior: 'smooth' });
}

$('scan').onclick = () => $('file').click();
$('file').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) scanReceipt(f); };
$('addFound').onclick = () => { addItems([...$('found').querySelectorAll('input')].map(i => i.value)); $('review').hidden = true; };
$('cancelFound').onclick = () => $('review').hidden = true;
$('manual').onsubmit = e => { e.preventDefault(); addItems([$('manualName').value]); $('manualName').value = ''; };
$('clearDone').onclick = clearDone;
$('share').onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); setStatus('Link copied — send it to the other person once.'); }
  catch { prompt('Send this link to the other person:', location.href); }
};

loadLocal(); render(); initSync();
setInterval(refresh, 30000);
document.addEventListener('visibilitychange', refresh);
</script>
</body>
</html>
